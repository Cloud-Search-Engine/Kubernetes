apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsearch-frontend
  labels:
    app.kubernetes.io/name: cloudsearch-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudsearch
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsearch-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsearch-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cloudsearch
    spec:
      containers:
        - name: frontend
          image: ghcr.io/kundanmergu/cloudsearch-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cloudsearch-config
          env:
            - name: API_BASE_URL
              value: http://cloudsearch-api.cloudsearch.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
