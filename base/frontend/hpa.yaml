apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudsearch-frontend
  labels:
    app.kubernetes.io/name: cloudsearch-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudsearch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudsearch-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
