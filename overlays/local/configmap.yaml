apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudsearch-config
  labels:
    app.kubernetes.io/part-of: cloudsearch
data:
  ENVIRONMENT: local
  HTTP_ADDR: ":8080"
  LOG_LEVEL: debug
  SEARCH_DEFAULT_LIMIT: "10"
  SEARCH_MAX_LIMIT: "50"
  SEARCH_CANDIDATE_LIMIT: "200"
  BM25_K1: "1.2"
  BM25_B: "0.75"
  # Local points at services reachable from the cluster (Kind/minikube host, or in-cluster deps)
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack.cloudsearch.svc.cluster.local:4566
