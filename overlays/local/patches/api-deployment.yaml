apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsearch-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/kundanmergu/cloudsearch-api:local
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
