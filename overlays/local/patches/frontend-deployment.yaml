apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsearch-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: frontend
          image: ghcr.io/kundanmergu/cloudsearch-frontend:local
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
