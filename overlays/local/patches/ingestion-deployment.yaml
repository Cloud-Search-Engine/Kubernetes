apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsearch-ingestion
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/kundanmergu/cloudsearch-ingestion:local
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
