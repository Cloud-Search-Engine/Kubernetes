apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudsearch-config
  labels:
    app.kubernetes.io/part-of: cloudsearch
data:
  ENVIRONMENT: production
  HTTP_ADDR: ":8080"
  LOG_LEVEL: info
  SEARCH_DEFAULT_LIMIT: "10"
  SEARCH_MAX_LIMIT: "50"
  SEARCH_CANDIDATE_LIMIT: "200"
  BM25_K1: "1.2"
  BM25_B: "0.75"
  AWS_REGION: us-east-1
