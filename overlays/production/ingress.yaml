apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudsearch
  labels:
    app.kubernetes.io/part-of: cloudsearch
  annotations:
    # Placeholder annotations — replace with your ingress controller (ALB, nginx, etc.)
    kubernetes.k8s.aws/alb: "true"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
spec:
  ingressClassName: alb
  rules:
    - host: search.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudsearch-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudsearch-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - search.example.com
      # secretName only needed for cert-manager / nginx; ALB uses ACM annotation above
      secretName: cloudsearch-tls
