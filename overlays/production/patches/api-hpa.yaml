apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudsearch-api
spec:
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
